<svg viewBox="0 0 1312 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="run-title run-desc" id="run-root">
        <title id="run-title">Inside one afk epic run</title>
        <desc id="run-desc">One afk epic run: the scheduler starts each ready task in its own worktree lane, a merge queue lands finished lanes one at a time on the epic branch, and a closeout review gates the pull request.</desc>
